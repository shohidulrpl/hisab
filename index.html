<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e2711d">
<title>মাসিক আয়-ব্যয় হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#26221c;--muted:#8a8577;--line:#efeae0;--thead:#faf7f0;--field:#fff;--border:#e3ddd0;--shadow:0 4px 16px rgba(30,20,5,.08);--orange1:#f6a04d;--orange2:#e2711d;--green:#1e9e5a;--red:#e5484d;--blue:#2c7be5}
[data-theme="dark"]{--bg:#0d1322;--card:#151d33;--ink:#eaf0ff;--muted:#8fa0bf;--line:#243150;--thead:#1b2540;--field:#101828;--border:#2a3a5f;--shadow:0 4px 18px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:0 12px 90px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 6px 22px var(--glow)}50%{box-shadow:0 10px 36px var(--glow)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.appbar{position:sticky;top:0;z-index:20;margin:0 -12px 14px;padding:12px 16px;display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--orange1),var(--orange2));color:#fff;box-shadow:0 4px 14px rgba(226,113,29,.35)}
.appbar h1{font-size:1.15rem;margin:0;flex:1}
.icon-btn{width:44px;height:44px;min-width:44px;border:none;border-radius:12px;background:var(--card);color:var(--orange2);font-size:1.3rem;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.icon-btn:active{transform:scale(.92)}
#themeBtn{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
.monthbar{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:14px;animation:fadeUp .4s both}
.month-pick{display:flex;gap:6px;background:var(--card);padding:6px;border-radius:12px;box-shadow:var(--shadow)}
.month-pick select{border:none;background:var(--field);color:var(--ink);font-family:inherit;font-size:1rem;font-weight:600;padding:8px;border-radius:8px}
.chip{border:none;background:var(--card);color:var(--orange2);font-family:inherit;font-weight:600;padding:10px 14px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow)}
.summary{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:10px;margin-bottom:14px;align-items:stretch}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);animation:fadeUp .5s both}
.summary .card{text-align:center;border-top:4px solid transparent;display:flex;flex-direction:column;justify-content:center}
.summary h3{margin:2px 0;font-size:.85rem;color:var(--muted)}
.summary p{margin:0;font-size:1.2rem;font-weight:700;word-break:break-all}
.c-inc{border-top-color:var(--green)}.c-inc p{color:var(--green)}
.c-exp{border-top-color:var(--red)}.c-exp p{color:var(--red)}
.c-bal{--glow:rgba(37,99,235,.4);border-top:none;background:linear-gradient(135deg,#3b82f6,#1d4ed8);padding:20px 14px;animation:fadeUp .5s both,glow 3s .6s infinite}
.c-bal h3{color:rgba(255,255,255,.85)}
.c-bal p{color:#fff;font-size:1.7rem;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.c-bal.negative{--glow:rgba(239,68,68,.4);background:linear-gradient(135deg,#ef4444,#b91c1c)}
.c-bal.bump{animation:fadeUp .5s both,glow 3s .6s infinite,bump .45s}
.chart{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.donut{width:120px;height:120px;min-width:120px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.donut-hole{width:82px;height:82px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-hole b{font-size:1.15rem}
.donut-hole span{font-size:.75rem;color:var(--muted)}
.chart-info{flex:1;min-width:180px}
.stat{display:flex;justify-content:space-between;font-size:.92rem;color:var(--muted);margin-bottom:4px}
.stat b{color:var(--ink)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0%;background:linear-gradient(90deg,var(--orange1),var(--red));transition:width .5s}
.tabs{display:flex;background:var(--card);border-radius:14px;padding:5px;box-shadow:var(--shadow);margin-bottom:14px}
.tab{flex:1;border:none;background:none;color:var(--muted);font-family:inherit;font-size:1rem;font-weight:600;padding:11px;border-radius:10px;cursor:pointer}
.tab.active{background:linear-gradient(135deg,var(--orange1),var(--orange2));color:#fff}
.panels{display:grid;grid-template-columns:1fr;gap:14px}
.panel h2{margin:0 0 10px;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.count{margin-left:auto;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%}.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.entry-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.span2{grid-column:1/-1}
input{padding:11px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:.95rem;width:100%;background:var(--field);color:var(--ink)}
.add{border:none;border-radius:10px;padding:12px;color:#fff;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer}
.add:active{transform:scale(.97)}
.add.g{background:var(--green)}.add.r{background:var(--red)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:340px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{background:var(--thead);color:var(--muted)}
tfoot td{font-weight:700;background:var(--thead)}
.del{border:none;background:none;color:var(--red);font-size:1.05rem;cursor:pointer;padding:6px}
.empty{text-align:center;color:var(--muted);padding:14px 0!important}
.actions{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.btn{border:none;background:var(--bg);color:var(--ink);font-family:inherit;font-weight:600;font-size:.9rem;padding:11px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;display:inline-block}
.btn.primary{background:linear-gradient(135deg,var(--orange1),var(--orange2));color:#fff}
.footer{margin:16px auto 0;text-align:center;color:var(--muted);font-size:.82rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;width:100%;max-width:430px;max-height:80vh;overflow:auto}
.h-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);font-size:.95rem}
.h-row .amt{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:90%}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:860px){body.tab-income .p-expense{display:none}body.tab-expense .p-income{display:none}
.summary{grid-template-columns:1fr 1fr}.c-bal{grid-column:1/-1;order:-1}.c-bal p{font-size:1.5rem}}
@media(min-width:861px){.tabs{display:none}.panels{grid-template-columns:1fr 1fr;max-width:1080px;margin:0 auto}.summary,.monthbar,.chart{max-width:1080px;margin-left:auto;margin-right:auto}.actions{justify-content:center}}
@media print{.no-print,.tabs,.entry-form,.actions,.del{display:none!important}body{background:#fff}.card,.panel{box-shadow:none;border:1px solid #ccc}.c-bal{background:#fff;color:#000}.c-bal p,.c-bal h3{color:#000;text-shadow:none}}
</style>
</head>
<body class="tab-income">
<header class="appbar no-print"><span style="font-size:1.4rem">💰</span><h1>মাসিক আয়-ব্যয় হিসাব</h1><button class="icon-btn" id="themeBtn">🌙</button></header>

<div class="monthbar no-print">
  <button class="icon-btn" id="prevM">‹</button>
  <div class="month-pick"><select id="monthSel"></select><select id="yearSel"></select></div>
  <button class="icon-btn" id="nextM">›</button>
  <button class="chip" id="todayBtn">আজ</button>
</div>

<div class="summary">
  <div class="card c-inc"><div style="font-size:1.3rem">📥</div><h3>মোট আয়</h3><p id="totalIncome">৳০</p></div>
  <div class="card c-bal" id="balanceCard"><div style="font-size:1.4rem">⚖️</div><h3>ব্যালান্স</h3><p id="balance">৳০</p></div>
  <div class="card c-exp"><div style="font-size:1.3rem">📤</div><h3>মোট খরচ</h3><p id="totalExpense">৳০</p></div>
</div>

<div class="card chart no-print">
  <div class="donut" id="donut"><div class="donut-hole"><b id="savePct">০%</b><span>সঞ্চয়</span></div></div>
  <div class="chart-info">
    <div class="stat"><span>খরচের হার</span><b id="expPct">০%</b></div>
    <div class="stat"><span>মোট এন্ট্রি</span><b id="entryCount">০টি</b></div>
    <div class="stat"><span>দেখছেন</span><b id="viewLabel">—</b></div>
    <div class="bar"><div class="fill" id="ratioFill"></div></div>
  </div>
</div>

<div class="tabs no-print">
  <button class="tab active" data-tab="income">📥 আয়</button>
  <button class="tab" data-tab="expense">📤 খরচ</button>
</div>

<div class="panels">
  <div class="card panel p-income">
    <h2><span class="dot g"></span>আয় ইনপুট<span class="count" id="incomeCount"></span></h2>
    <form class="entry-form no-print" id="incomeForm">
      <input type="date" id="incomeDate" required>
      <input type="number" id="incomeAmount" min="0" step="0.01" inputmode="decimal" placeholder="পরিমাণ (৳)" required>
      <input type="text" class="span2" id="incomeNote" placeholder="বিবরণ (ঐচ্ছিক), যেমন: বেতন">
      <button class="add g span2" type="submit">＋ আয় যোগ করুন</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>টাকা</th><th class="no-print"></th></tr></thead>
      <tbody id="incomeBody"></tbody><tfoot><tr><td colspan="2">মোট</td><td id="incomeTotal">৳০</td><td class="no-print"></td></tr></tfoot></table></div>
  </div>
  <div class="card panel p-expense">
    <h2><span class="dot r"></span>খরচ ইনপুট<span class="count" id="expenseCount"></span></h2>
    <form class="entry-form no-print" id="expenseForm">
      <input type="date" id="expenseDate" required>
      <input type="number" id="expenseAmount" min="0" step="0.01" inputmode="decimal" placeholder="পরিমাণ (৳)" required>
      <input type="text" class="span2" id="expenseNote" placeholder="বিবরণ (ঐচ্ছিক), যেমন: বাজার, ভাড়া">
      <button class="add r span2" type="submit">＋ খরচ যোগ করুন</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>তারিখ</th><th>বিবরণ</th><th>টাকা</th><th class="no-print"></th></tr></thead>
      <tbody id="expenseBody"></tbody><tfoot><tr><td colspan="2">মোট</td><td id="expenseTotal">৳০</td><td class="no-print"></td></tr></tfoot></table></div>
  </div>
</div>

<div class="footer no-print">💾 ডেটা এই ডিভাইসে সংরক্ষিত • মাঝে মাঝে ব্যাকআপ নিন</div>

<div class="actions no-print">
  <button class="btn primary" id="excelBtn">📥 Excel এক্সপোর্ট</button>
  <button class="btn" id="historyBtn">📚 সব মাস</button>
  <button class="btn" id="backupBtn">💾 ব্যাকআপ</button>
  <label class="btn" for="restoreInput">📤 রিস্টোর</label>
  <input type="file" id="restoreInput" hidden accept=".json">
  <button class="btn" id="printBtn">🖨️ প্রিন্ট</button>
</div>

<div class="modal no-print" id="historyModal"><div class="sheet"><h3>📚 সংরক্ষিত মাসের তালিকা</h3><div id="historyList"></div><br><button class="btn" id="closeHistory" style="width:100%">বন্ধ করুন</button></div></div>
<div class="modal no-print" id="confirmModal"><div class="sheet"><h3>নিশ্চিত করুন</h3><p id="confirmMsg"></p><div style="display:flex;gap:8px"><button class="btn primary" id="confirmYes" style="flex:1">হ্যাঁ</button><button class="btn" id="confirmNo" style="flex:1">না</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
window.addEventListener('error',function(e){var t=document.getElementById('toast');if(t){t.textContent='❌ এরর: '+e.message;t.className='toast show';}});
var BN=['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
var MONTHS=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
function toBn(s){return String(s).replace(/\d/g,function(d){return BN[d];});}
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDateBn(s){var p=s.split('-');return toBn(p[2])+'-'+toBn(p[1])+'-'+toBn(p[0].slice(2));}
function fmt(n){return toBn((Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2}));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function $(id){return document.getElementById(id);}
var now0=new Date(),viewYear=now0.getFullYear(),viewMonth=now0.getMonth();
function keyOf(){return viewYear+'-'+pad(viewMonth+1);}
function isCur(){var n=new Date();return n.getFullYear()===viewYear&&n.getMonth()===viewMonth;}
function load(){try{return JSON.parse(localStorage.getItem('hishab-'+keyOf()))||{income:[],expense:[]};}catch(e){return{income:[],expense:[]};}}
function save(d){localStorage.setItem('hishab-'+keyOf(),JSON.stringify(d));}
var toastTimer=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.className='toast show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='toast';},2200);}
function openModal(id){$(id).classList.add('open');}
function closeModals(){var m=document.querySelectorAll('.modal');for(var i=0;i<m.length;i++)m[i].classList.remove('open');}
var confirmCb=null;
function askConfirm(msg,cb){$('confirmMsg').textContent=msg;confirmCb=cb;openModal('confirmModal');}
$('confirmYes').onclick=function(){closeModals();if(confirmCb)confirmCb();};
$('confirmNo').onclick=closeModals;
$('closeHistory').onclick=closeModals;
function animate(el,to,fn){var from=parseFloat(el.dataset.v||'0'),t0=performance.now();
  function step(t){var p=Math.min(1,(t-t0)/500),e=1-Math.pow(1-p,3),v=from+(to-from)*e;el.textContent=fn(v);if(p<1)requestAnimationFrame(step);else el.dataset.v=to;}
  requestAnimationFrame(step);}
function bumpBalance(){var b=$('balanceCard');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function buildYears(){var ys={},ny=new Date().getFullYear(),y;for(y=ny-5;y<=ny+3;y++)ys[y]=1;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i),m=k.match(/^hishab-(\d{4})-\d{2}$/);if(m)ys[m[1]]=1;}
  ys[viewYear]=1;var arr=Object.keys(ys).sort(),html='';for(i=0;i<arr.length;i++)html+='<option value="'+arr[i]+'">'+toBn(arr[i])+'</option>';
  $('yearSel').innerHTML=html;}
function syncSelects(){var html='';for(var i=0;i<12;i++)html+='<option value="'+i+'">'+MONTHS[i]+'</option>';
  $('monthSel').innerHTML=html;$('monthSel').value=viewMonth;$('yearSel').value=viewYear;}
function resetDates(){var def=isCur()?iso(new Date()):keyOf()+'-01';$('incomeDate').value=def;$('expenseDate').value=def;}
function renderTable(type,list,sum){var html='';
  if(list.length){for(var i=0;i<list.length;i++){var e=list[i];html+='<tr><td>'+fmtDateBn(e.date)+'</td><td>'+(e.note?esc(e.note):'—')+'</td><td style="font-weight:600">৳'+fmt(e.amount)+'</td><td class="no-print"><button class="del" data-type="'+type+'" data-id="'+e.id+'">✕</button></td></tr>';}}
  else html='<tr><td colspan="4" class="empty">কোনো এন্ট্রি নেই</td></tr>';
  $(type+'Body').innerHTML=html;$(type+'Total').textContent='৳'+fmt(sum);$(type+'Count').textContent='('+toBn(list.length)+'টি)';}
function render(){var data=load();
  var inc=data.income.reduce(function(s,e){return s+e.amount;},0);
  var exp=data.expense.reduce(function(s,e){return s+e.amount;},0);
  var bal=inc-exp;
  $('viewLabel').textContent=MONTHS[viewMonth]+' '+toBn(viewYear);
  animate($('totalIncome'),inc,function(v){return '৳'+fmt(v);});
  animate($('totalExpense'),exp,function(v){return '৳'+fmt(v);});
  animate($('balance'),bal,function(v){return v<0?'−৳'+fmt(-v):'৳'+fmt(v);});
  $('balanceCard').classList.toggle('negative',bal<0);
  var expP=inc>0?Math.min(100,exp/inc*100):(exp>0?100:0);
  var savP=inc>0?Math.round(bal/inc*100):0;
  $('donut').style.background=inc>0?'conic-gradient(var(--red) 0 '+expP+'%, var(--green) '+expP+'% 100%)':'var(--line)';
  $('savePct').textContent=toBn(savP)+'%';$('savePct').style.color=savP<0?'var(--red)':'var(--green)';
  $('expPct').textContent=toBn(Math.round(expP))+'%';
  $('entryCount').textContent=toBn(data.income.length+data.expense.length)+'টি';
  $('ratioFill').style.width=expP+'%';
  renderTable('income',data.income,inc);renderTable('expense',data.expense,exp);}
function setView(y,m){viewYear=y;viewMonth=m;buildYears();syncSelects();resetDates();render();}
$('prevM').onclick=function(){var m=viewMonth-1,y=viewYear;if(m<0){m=11;y--;}setView(y,m);};
$('nextM').onclick=function(){var m=viewMonth+1,y=viewYear;if(m>11){m=0;y++;}setView(y,m);};
$('monthSel').onchange=function(){setView(viewYear,+this.value);};
$('yearSel').onchange=function(){setView(+this.value,viewMonth);};
$('todayBtn').onclick=function(){var n=new Date();setView(n.getFullYear(),n.getMonth());toast('চলতি মাসে ফিরে এলেন');};
var tabBtns=document.querySelectorAll('.tab');
for(var ti=0;ti<tabBtns.length;ti++){tabBtns[ti].onclick=function(){
  for(var j=0;j<tabBtns.length;j++)tabBtns[j].classList.remove('active');this.classList.add('active');
  document.body.classList.remove('tab-income','tab-expense');document.body.classList.add('tab-'+this.dataset.tab);};}
function bindForm(type){$(type+'Form').addEventListener('submit',function(ev){ev.preventDefault();
  var date=$(type+'Date').value,amount=parseFloat($(type+'Amount').value);
  if(!date||!(amount>0)){toast('সঠিক তারিখ ও পরিমাণ লিখুন');return;}
  var data=load();data[type].push({id:Date.now(),date:date,note:$(type+'Note').value.trim(),amount:Math.round(amount*100)/100});
  data[type].sort(function(a,b){return a.date<b.date?-1:1;});
  save(data);$(type+'Amount').value='';$(type+'Note').value='';render();bumpBalance();
  toast(type==='income'?'আয় যোগ হয়েছে ✅':'খরচ যোগ হয়েছে ✅');});}
bindForm('income');bindForm('expense');
document.addEventListener('click',function(e){var b=(e.target.closest)?e.target.closest('.del'):null;if(!b)return;
  askConfirm('এন্ট্রিটি মুছে ফেলবেন?',function(){var data=load();
    data[b.dataset.type]=data[b.dataset.type].filter(function(x){return x.id!==+b.dataset.id;});
    save(data);render();bumpBalance();toast('মুছে ফেলা হয়েছে 🗑️');});});
function xlTable(title,list){var s='<table border="1"><tr><th colspan="3" style="background:#f2994a;color:#fff">'+title+'</th></tr><tr><th>তারিখ</th><th>বিবরণ</th><th>টাকা</th></tr>';
  if(!list.length)s+='<tr><td colspan="3">—</td></tr>';
  for(var i=0;i<list.length;i++){var e=list[i],p=e.date.split('-');s+='<tr><td>'+p[2]+'-'+p[1]+'-'+p[0]+'</td><td>'+esc(e.note||'')+'</td><td>'+e.amount+'</td></tr>';}
  return s+'</table><br>';}
$('excelBtn').onclick=function(){var data=load();
  if(!data.income.length&&!data.expense.length){toast('এই মাসের কোনো ডেটা নেই!');return;}
  var inc=data.income.reduce(function(s,e){return s+e.amount;},0),exp=data.expense.reduce(function(s,e){return s+e.amount;},0);
  var html='<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"></head><body><h2>মাসিক আয়-ব্যয় হিসাব — '+MONTHS[viewMonth]+' '+toBn(viewYear)+'</h2><table border="1"><tr><td>মোট আয়</td><td>'+inc+'</td></tr><tr><td>মোট খরচ</td><td>'+exp+'</td></tr><tr><td>ব্যালান্স</td><td>'+(inc-exp)+'</td></tr></table><br>'+xlTable('আয়',data.income)+xlTable('খরচ',data.expense)+'</body></html>';
  var blob=new Blob(['\uFEFF'+html],{type:'application/vnd.ms-excel;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hishab-'+keyOf()+'.xls';a.click();
  toast('Excel ফাইল ডাউনলোড হয়েছে 📥');};
$('historyBtn').onclick=function(){var items=[],i;
  for(i=0;i<localStorage.length;i++){var k=localStorage.key(i),m=k.match(/^hishab-(\d{4})-(\d{2})$/);
    if(m){var d;try{d=JSON.parse(localStorage.getItem(k));}catch(e){d={};}
      var inc=(d.income||[]).reduce(function(s,e){return s+e.amount;},0),exp=(d.expense||[]).reduce(function(s,e){return s+e.amount;},0);
      items.push({y:+m[1],mo:+m[2]-1,inc:inc,exp:exp});}}
  items.sort(function(a,b){return b.y-a.y||b.mo-a.mo;});
  var html='';for(i=0;i<items.length;i++){var it=items[i];
    html+='<div class="h-row"><div><b>'+MONTHS[it.mo]+' '+toBn(it.y)+'</b><div class="amt">আয় ৳'+fmt(it.inc)+' • খরচ ৳'+fmt(it.exp)+' • ব্যালান্স ৳'+fmt(it.inc-it.exp)+'</div></div><button class="btn primary" data-y="'+it.y+'" data-m="'+it.mo+'">দেখুন</button></div>';}
  $('historyList').innerHTML=html||'<p style="color:var(--muted)">এখনো কোনো ডেটা নেই</p>';
  openModal('historyModal');};
$('historyList').addEventListener('click',function(e){var b=(e.target.closest)?e.target.closest('button[data-y]'):null;if(!b)return;
  closeModals();setView(+b.dataset.y,+b.dataset.m);toast('মাস লোড হয়েছে 📂');});
$('backupBtn').onclick=function(){var obj={},n=0;
  for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf('hishab-')===0){obj[k]=localStorage.getItem(k);n++;}}
  if(!n){toast('ব্যাকআপের মতো ডেটা নেই!');return;}
  var blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hishab-backup-'+iso(new Date())+'.json';a.click();
  toast('ব্যাকআপ ডাউনলোড হয়েছে 💾');};
$('restoreInput').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader(),self=this;
  r.onload=function(){try{var obj=JSON.parse(r.result),n=0;
    for(var k in obj){if(/^hishab-\d{4}-\d{2}$/.test(k)){localStorage.setItem(k,obj[k]);n++;}}
    buildYears();syncSelects();render();toast('রিস্টোর সফল: '+toBn(n)+'টি মাস 📤');}
    catch(err){toast('ফাইলটি সঠিক নয়!');}};
  r.readAsText(f);self.value='';};
if(localStorage.getItem('hishab-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');
function syncThemeBtn(){$('themeBtn').textContent=(document.documentElement.getAttribute('data-theme')==='dark')?'☀️':'';}
syncThemeBtn();
$('themeBtn').onclick=function(){var dark=document.documentElement.getAttribute('data-theme')==='dark';
  if(dark)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');
  localStorage.setItem('hishab-theme',dark?'light':'dark');syncThemeBtn();};
$('printBtn').onclick=function(){window.print();};
buildYears();syncSelects();resetDates();render();toast('অ্যাপ প্রস্তুত ✅');
</script>
</body>
</html>
